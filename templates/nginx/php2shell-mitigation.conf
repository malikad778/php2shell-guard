# php2shell-guard generated mitigation snippet (Target: nginx)
# Covers: CVE-2026-109618 (M4, M8), CVE-2026-109619 (M7, M8)
# Confidence: M4/M7 Official; M8 Vendor-reported (Datadog, Cloudflare)
# IMPORTANT: Reduces exposure only. This does not replace patching.
# Validate before reload: nginx -t && systemctl reload nginx

# M4: Enforce strict frontend request body size and timeout boundaries.
client_max_body_size 8m;
client_body_buffer_size 128k;
client_body_timeout 10s;
client_header_timeout 10s;

# M8: Block anomalous chunked transfer encodings lacking Content-Length on POST endpoints where not required.
# Note: Do NOT pass fastcgi_param PHP_VALUE or PHP_ADMIN_VALUE here (M7: per-request INI overrides can emit early diagnostics).
