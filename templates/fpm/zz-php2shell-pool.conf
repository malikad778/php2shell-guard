; php2shell-guard generated mitigation snippet (Target: fpm)
; Covers: CVE-2026-109618 (M2), CVE-2026-109619 (M5, M6, M9)
; Confidence: M2/M5/M6 Official, partial; M9 Reasoning-based (worker recycling lowers stale state reuse odds)
; IMPORTANT: Reduces exposure only. This does not replace patching.
; Place in your FPM pool.d directory and run: php-fpm -t && systemctl restart php-fpm

[www]
; M2: Administratively lock memory_limit to -1 so neither .user.ini nor ini_set() can restore a finite limit.
php_admin_value[memory_limit] = -1

; M4: Administratively lock POST size limits (adjust 8M if larger uploads are required).
php_admin_value[post_max_size] = 8M
php_admin_value[upload_max_filesize] = 8M

; M5: Administratively disable session.upload_progress prior to request initialization.
php_admin_flag[session.upload_progress.enabled] = off

; M6: Administratively disable fatal_error_backtraces (PHP 8.5+).
php_admin_flag[fatal_error_backtraces] = off

; M9: Recycle workers frequently to reduce stale global state persistence across requests.
pm.max_requests = 250
request_terminate_timeout = 30s
