# php2shell-guard generated mitigation snippet (Target: systemd)
# Covers: CVE-2026-109618 (M3 cgroup MemoryMax boundary without RLIMIT_AS/RLIMIT_DATA)
# Confidence: Official (PHP advisory GHSA-w8hw-w9fx-j79w)
# IMPORTANT: Reduces exposure only. This does not replace patching.
# Save to: /etc/systemd/system/php8.3-fpm.service.d/php2shell-guard.conf
# Then run: systemctl daemon-reload && systemctl restart php8.3-fpm

[Service]
# M3: Use cgroup MemoryMax as the availability boundary.
MemoryMax=512M
MemorySwapMax=0

# M3: Explicitly ensure RLIMIT_AS and RLIMIT_DATA are infinity (never finite).
LimitAS=infinity
LimitDATA=infinity
