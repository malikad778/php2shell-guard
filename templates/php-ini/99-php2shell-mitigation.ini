; php2shell-guard generated mitigation snippet (Target: php-ini)
; Covers: CVE-2026-109618 (M2, M4), CVE-2026-109619 (M5, M6)
; Confidence: Official, partial (PHP advisory GHSA-w8hw-w9fx-j79w & GHSA-6wmf-4rv5-p3rp)
; IMPORTANT: Reduces exposure only. This does not replace patching.
; After applying, restart all PHP-FPM / Apache / FrankenPHP workers.

; M2: Disable finite per-script memory limit so controllable OOM cleanup path is not triggered.
; Note: Prefer enforcing via php_admin_value[memory_limit] = -1 in FPM pool or Apache vhost
; so application scripts cannot override it with ini_set().
memory_limit = -1

; M4: Restrict maximum POST body size (tune to your application's legitimate upload needs).
post_max_size = 8M
upload_max_filesize = 8M
max_file_uploads = 10
max_input_vars = 1000

; M5: Disable session upload progress before request parsing (covers one confirmed path of CVE-2026-109619).
session.upload_progress.enabled = 0

; M6: On PHP 8.5, disable fatal error backtraces before request parsing.
fatal_error_backtraces = 0

; Harden error exposure in responses.
expose_php = Off
display_errors = Off
display_startup_errors = Off
