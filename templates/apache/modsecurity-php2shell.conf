# php2shell-guard generated mitigation snippet (Target: modsecurity)
# Covers: CVE-2026-109618, CVE-2026-109619 (M8 known exploit payload patterns)
# Confidence: Vendor-reported (Datadog, Cloudflare, Vercel)
# IMPORTANT: Reduces exposure only. Can be bypassed. This does not replace patching.

# Reject form field names exceeding 2048 bytes or containing control bytes (0x00-0x1f).
SecRule ARGS_NAMES "@rx .{2048,}" \
    "id:20261091,phase:2,deny,status:400,log,msg:'php2shell-guard M8: Excessive form field name length'"

SecRule ARGS_NAMES "@validateByteRange 32-126" \
    "id:20261092,phase:2,t:none,deny,status:400,log,msg:'php2shell-guard M8: Control byte in form field name'"

# Flag form fields near the 3.5 MB lab exploit threshold when combined with PHP endpoints.
SecRule REQUEST_BODY_LENGTH "@gt 3500000" \
    "id:20261093,phase:2,pass,log,msg:'php2shell-guard M8: Large request body (>3.5MB) inspected'"
