# php2shell-guard generated mitigation snippet (Target: apache)
# Covers: CVE-2026-109618 (M2, M4), CVE-2026-109619 (M5, M6, M7)
# Confidence: Official, partial (PHP advisory GHSA-w8hw-w9fx-j79w & GHSA-6wmf-4rv5-p3rp)
# IMPORTANT: Reduces exposure only. This does not replace patching.
# Note: Apache mod_php has the highest SAPI risk rating. Consider migrating to PHP-FPM and patching immediately.

<IfModule mod_php.c>
    # M2: Administratively enforce memory_limit -1 in vhost/server config (never .htaccess).
    php_admin_value memory_limit -1
    php_admin_value post_max_size 8M
    php_admin_value upload_max_filesize 8M
    # M5: Disable session upload progress before request parsing.
    php_admin_flag session.upload_progress.enabled Off
    # M6: Disable fatal_error_backtraces on PHP 8.5.
    php_admin_flag fatal_error_backtraces Off
</IfModule>

# M4: Enforce Apache request body ceiling (8 MB = 8388608 bytes).
LimitRequestBody 8388608
LimitRequestFields 100
LimitRequestFieldSize 8190

# M7: Prevent .htaccess files from overriding php_value / php_flag per request.
<Directory "/var/www/html">
    AllowOverride FileInfo AuthConfig Limit Indexes
</Directory>
