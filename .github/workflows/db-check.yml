name: Advisory Database Integrity Check

on:
  push:
    paths:
      - "data/**"
  pull_request:
    paths:
      - "data/**"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  verify-db:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate schema, two-source rule, and 30-day freshness
        run: node bin/php2shell-guard.mjs db:verify
